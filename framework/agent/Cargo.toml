[package]
name = "agent"
version = "0.1.0"
edition = "2021"
description = "Agent trait + event types powering the copilot pane. Rule-based stub today, LLM-backed tomorrow."
license = "MIT OR Apache-2.0"

[lib]
name = "agent"
path = "src/lib.rs"

[dependencies]
# We produce a stream of Fragment envelopes — reuse the ui-shell types
# so agent output and normal HTTP responses share the exact same wire
# format on the browser side.
ui-shell = { path = "../ui-shell" }

async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
