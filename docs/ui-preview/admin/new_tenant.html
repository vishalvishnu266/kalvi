<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>New Tenant · Admin · School ERP</title>
  <link rel="stylesheet" href="../assets/app.build.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../assets/boot.js"></script>
</head>
<body class="admin-body">

<header class="admin-header">
  <div class="admin-header-inner max-w-3xl">
    <a href="tenants.html" class="icon-btn">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </a>
    <div>
      <div class="text-sm font-semibold tracking-tight">New tenant</div>
      <div class="text-xs text-zinc-500">Create a tenant row and provision its database</div>
    </div>
    <div class="ml-auto">
      <button data-theme-toggle class="icon-btn" title="Toggle theme">
        <i data-lucide="moon" class="w-4 h-4 hidden dark:inline"></i>
        <i data-lucide="sun"  class="w-4 h-4 inline dark:hidden"></i>
      </button>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8">

  <form action="tenants.html" class="card card-body space-y-5">

    <div class="field">
      <label class="field-label">Tenant ID</label>
      <input name="tenant_id" required pattern="[A-Za-z0-9_-]{1,64}"
             placeholder="acme" class="input font-mono" />
      <p class="mt-1 text-xs text-zinc-500">
        Short slug used in URLs (<code>/web/&lt;id&gt;/</code>).
        Letters, digits, <code>-</code>, <code>_</code>.
      </p>
    </div>

    <div class="field">
      <label class="field-label">Display name</label>
      <input name="name" required placeholder="Acme Public School" class="input" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="field">
        <label class="field-label">Plan (optional)</label>
        <input name="plan" placeholder="starter / pro / enterprise" class="input" />
      </div>
      <div class="field">
        <label class="field-label">Notes (optional)</label>
        <input name="notes" placeholder="Internal notes" class="input" />
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 pt-2">
      <a href="tenants.html" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">
        <i data-lucide="check" class="w-4 h-4"></i>
        <span>Create tenant</span>
      </button>
    </div>
  </form>
</main>

</body>
</html>
