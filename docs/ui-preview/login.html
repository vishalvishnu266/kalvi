<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in · School ERP</title>
  <link rel="stylesheet" href="assets/app.build.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/boot.js"></script>
</head>
<body class="auth-body">

<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <div class="flex flex-col items-center mb-8">
      <div class="brand-mark brand-mark-lg">
        <i data-lucide="school" class="w-7 h-7"></i>
      </div>
      <h1 class="mt-4 text-2xl font-semibold tracking-tight">Welcome back</h1>
      <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">Sign in to your School ERP</p>
    </div>

    <div class="card card-body">

      <div class="alert alert-error mb-4">
        <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5"></i>
        <div>Sample error message — remove this block to see the clean form.</div>
      </div>

      <form action="dashboard.html" class="space-y-4">
        <div class="field">
          <label class="field-label">Tenant / School ID</label>
          <div class="field-wrap">
            <i data-lucide="building-2" class="field-icon"></i>
            <input name="tenant" required value="acme" placeholder="e.g. acme"
                   class="input input-icon-left" />
          </div>
        </div>

        <div class="field">
          <label class="field-label">Username or Email</label>
          <div class="field-wrap">
            <i data-lucide="user" class="field-icon"></i>
            <input name="identifier" required value="jane.doe" autocomplete="username"
                   class="input input-icon-left" />
          </div>
        </div>

        <div class="field">
          <div class="flex items-center justify-between mb-1.5">
            <label class="field-label mb-0">Password</label>
            <a href="#" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">Forgot?</a>
          </div>
          <div class="field-wrap">
            <i data-lucide="lock" class="field-icon"></i>
            <input type="password" name="password" required autocomplete="current-password"
                   class="input input-icon-left" value="password" />
          </div>
        </div>

        <label class="flex items-center gap-2 text-sm text-zinc-600 dark:text-zinc-400">
          <input type="checkbox" class="rounded border-zinc-300 text-brand-600 focus:ring-brand-500 dark:bg-zinc-800 dark:border-zinc-600" />
          Remember me on this device
        </label>

        <button type="submit" class="btn btn-primary w-full">
          <span>Sign in</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-zinc-500 dark:text-zinc-400">
      &copy; 2026 School ERP · Secure multi-tenant portal
    </p>
  </div>
</div>

</body>
</html>
