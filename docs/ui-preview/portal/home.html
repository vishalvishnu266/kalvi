<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Portal Home · School ERP</title>
  <link rel="stylesheet" href="../assets/app.build.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../assets/boot.js"></script>
</head>
<body class="admin-body">

<main class="max-w-5xl mx-auto px-6 py-8 space-y-4">

  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Portal Home</h1>
      <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">Alex Parent</p>
    </div>
    <button class="btn btn-primary btn-sm">Sign out</button>
  </div>

  <section class="card card-body">
    <h2 class="font-semibold mb-1">Link school account</h2>
    <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-3">
      Use tenant login credentials to attach each school account.
    </p>
    <form class="flex flex-wrap gap-2">
      <input name="tenant"     placeholder="tenant id"        class="input flex-1 min-w-[10rem]" />
      <input name="identifier" placeholder="username or email" class="input flex-1 min-w-[12rem]" />
      <input name="password" type="password" placeholder="password" class="input flex-1 min-w-[10rem]" />
      <button type="submit" class="btn btn-primary">Link</button>
    </form>
  </section>

  <section class="card card-body">
    <h3 class="font-semibold">Tenant: acme · Role: guardian</h3>
    <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">
      Student and guardian views for this tenant are coming soon.
    </p>
  </section>

  <section class="card card-body">
    <h3 class="font-semibold">Tenant: north-star · Role: student</h3>
    <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">
      Student and guardian views for this tenant are coming soon.
    </p>
  </section>
</main>

</body>
</html>
