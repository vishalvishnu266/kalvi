<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sunrise K-12 · Settings</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/global.css">
  <script type="module" src="components/index.js"></script>
</head>
<body>
  <app-shell page-title="Settings" active="settings">

    <section style="display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-5);">

      <ui-card title="Profile" padded>
        <div class="row" style="margin-bottom: var(--space-4);">
          <ui-avatar name="Anita R." size="xl"></ui-avatar>
          <div>
            <div style="font-weight:600;">Anita Ramaswamy</div>
            <div class="muted">Principal · Sunrise K-12</div>
          </div>
        </div>
        <div class="stack">
          <ui-input label="Display name" value="Anita Ramaswamy"></ui-input>
          <ui-input label="Email" type="email" value="anita@sunrise.edu"></ui-input>
          <ui-input label="Phone" value="+1 555 0134"></ui-input>
        </div>
      </ui-card>

      <ui-card title="Appearance" subtitle="Theme &amp; brand color" padded>
        <div class="stack">
          <div>
            <div class="muted" style="font-size:var(--fs-xs); margin-bottom: 8px; font-weight:500;">Theme</div>
            <ui-segmented value="light" id="themeSeg">
              <button value="light">Light</button>
              <button value="dark">Dark</button>
              <button value="auto">Auto</button>
            </ui-segmented>
          </div>
          <div>
            <div class="muted" style="font-size:var(--fs-xs); margin-bottom: 8px; font-weight:500;">Primary color</div>
            <div class="row" style="flex-wrap: wrap; gap:10px;">
              <span onclick="setPrimary('#0a84ff')" class="dot" style="background:#0a84ff"></span>
              <span onclick="setPrimary('#5e5ce6')" class="dot" style="background:#5e5ce6"></span>
              <span onclick="setPrimary('#af52de')" class="dot" style="background:#af52de"></span>
              <span onclick="setPrimary('#ff375f')" class="dot" style="background:#ff375f"></span>
              <span onclick="setPrimary('#ff9f0a')" class="dot" style="background:#ff9f0a"></span>
              <span onclick="setPrimary('#34c759')" class="dot" style="background:#34c759"></span>
              <span onclick="setPrimary('#5ac8fa')" class="dot" style="background:#5ac8fa"></span>
              <span onclick="setPrimary('#ffd60a')" class="dot" style="background:#ffd60a"></span>
              <label class="dot" style="background:conic-gradient(from 0deg, red, yellow, lime, cyan, blue, magenta, red); cursor:pointer; position:relative; overflow:hidden;">
                <input type="color" oninput="setPrimary(this.value)" style="position:absolute; inset:0; opacity:0; cursor:pointer;">
              </label>
            </div>
          </div>
        </div>
      </ui-card>

      <ui-card title="Notifications" padded>
        <div class="stack">
          <ui-list-item title="Attendance alerts"    subtitle="Notify when > 3 absentees" trailing="On"></ui-list-item>
          <ui-list-item title="Fee reminders"        subtitle="Automatic emails to guardians" trailing="On"></ui-list-item>
          <ui-list-item title="Weekly digest"        subtitle="Every Monday 8:00 AM" trailing="Off"></ui-list-item>
        </div>
      </ui-card>

      <ui-card title="Danger Zone" padded>
        <div class="stack">
          <p class="muted">These actions cannot be undone. Please proceed with care.</p>
          <ui-button variant="danger" onclick="toast('Academic year archived', { tone:'danger', desc:'Records moved to read-only mode.' })">Archive Academic Year</ui-button>
        </div>
      </ui-card>

    </section>
  </app-shell>

  <script>
    function setTheme(t) {
      if (!t || t === 'auto') { document.documentElement.removeAttribute('data-theme'); localStorage.removeItem('erp.theme'); return; }
      document.documentElement.dataset.theme = t;
      localStorage.setItem('erp.theme', t);
    }
    function setPrimary(c) {
      document.documentElement.style.setProperty('--color-primary', c);
      localStorage.setItem('erp.primary', c);
    }
    document.addEventListener('DOMContentLoaded', () => {
      const seg = document.getElementById('themeSeg');
      if (seg) {
        seg.setAttribute('value', localStorage.getItem('erp.theme') || 'auto');
        seg.addEventListener('change', e => setTheme(e.detail.value));
      }
    });
  </script>

  <style>
    .dot {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid var(--color-surface);
      box-shadow: 0 0 0 1px var(--color-border), var(--shadow-xs);
      display: inline-block;
      transition: transform var(--dur-fast) var(--ease-spring);
    }
    .dot:hover { transform: scale(1.12); }
    @media (max-width: 860px) {
      section[style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
    }
  </style>
</body>
</html>
