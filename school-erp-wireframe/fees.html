<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sunrise K-12 · Fees</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/global.css">
  <script type="module" src="components/index.js"></script>
</head>
<body>
  <app-shell page-title="Fees" active="fees">

    <section style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6);">
      <ui-stat label="Collected (MTD)" value="$42,680" delta="-4.4%" trend="down" icon="card"></ui-stat>
      <ui-stat label="Pending"         value="$18,120" delta="+8.1%" trend="up"   icon="clipboard"></ui-stat>
      <ui-stat label="Overdue"         value="$6,240"  delta="+1.9%" trend="up"   icon="bell"></ui-stat>
      <ui-stat label="Scholarships"    value="$3,900"  icon="award"></ui-stat>
    </section>

    <div class="row" style="margin-bottom: var(--space-4);">
      <ui-input placeholder="Search invoices…" style="flex:1; max-width:420px;"></ui-input>
      <div class="grow"></div>
      <ui-button variant="secondary" icon="download">Export</ui-button>
      <ui-button icon="plus" onclick="document.getElementById('newInv').open()">New Invoice</ui-button>
    </div>

    <ui-card>
      <ui-tab-bar>
        <a href="#" data-active>All</a>
        <a href="#">Pending</a>
        <a href="#">Overdue</a>
        <a href="#">Paid</a>
      </ui-tab-bar>

      <ui-list-item clickable title="INV-2026-0421" subtitle="Aarav Kumar · Tuition · Aug">
        <ui-avatar slot="leading" name="Aarav Kumar"></ui-avatar>
        <div slot="trailing" style="display:flex; align-items:center; gap: var(--space-3);">
          <span>$420.00</span>
          <ui-badge tone="success">Paid</ui-badge>
        </div>
      </ui-list-item>
      <ui-list-item clickable title="INV-2026-0422" subtitle="Meera Sharma · Tuition · Aug">
        <ui-avatar slot="leading" name="Meera Sharma"></ui-avatar>
        <div slot="trailing" style="display:flex; align-items:center; gap: var(--space-3);">
          <span>$380.00</span>
          <ui-badge tone="warning">Pending</ui-badge>
        </div>
      </ui-list-item>
      <ui-list-item clickable title="INV-2026-0423" subtitle="Rohan Iyer · Tuition · Jul">
        <ui-avatar slot="leading" name="Rohan Iyer"></ui-avatar>
        <div slot="trailing" style="display:flex; align-items:center; gap: var(--space-3);">
          <span>$540.00</span>
          <ui-badge tone="danger">Overdue</ui-badge>
        </div>
      </ui-list-item>
      <ui-list-item clickable title="INV-2026-0424" subtitle="Zara Fernandes · Bus · Aug">
        <ui-avatar slot="leading" name="Zara Fernandes"></ui-avatar>
        <div slot="trailing" style="display:flex; align-items:center; gap: var(--space-3);">
          <span>$60.00</span>
          <ui-badge tone="success">Paid</ui-badge>
        </div>
      </ui-list-item>
    </ui-card>

    <ui-modal id="newInv" title="New Invoice">
      <div class="stack">
        <ui-input label="Student" placeholder="Search student…" required></ui-input>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);">
          <ui-input label="Amount" type="number" placeholder="0.00" required></ui-input>
          <ui-input label="Due date" type="date"></ui-input>
        </div>
        <ui-input label="Notes" type="textarea"></ui-input>
      </div>
      <div slot="footer">
        <ui-button variant="secondary" data-close>Cancel</ui-button>
        <ui-button>Create Invoice</ui-button>
      </div>
    </ui-modal>

  </app-shell>
</body>
</html>
