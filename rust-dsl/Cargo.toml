[package]
name = "lit-ui"
version = "0.1.0"
edition = "2021"
description = "Vaadin-style, macro-free Rust DSL that renders to Lit web components."
license = "MIT OR Apache-2.0"

# The library part — reusable from any Rust project (Axum, Actix, etc.).
[lib]
name = "lit_ui"
path = "src/lib.rs"


[dependencies]
# The only dependency: our sibling proc-macro crate that generates setters,
# Default, and Component::render() for primitive components. Zero runtime
# cost — everything is compile-time codegen.
lit-ui-macros = { path = "../rust-dsl-macros", version = "0.1.0" }
