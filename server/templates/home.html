{% extends "base.html" %}

{% block title %}School ERP - Home{% endblock %}

{% block body %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg">
                <div class="card-body p-5 text-center">
                    <h1 class="display-4 mb-3">🎓</h1>
                    <h2 class="mb-3">School ERP System</h2>
                    <p class="text-muted mb-4">Multi-tenant education management platform</p>

                    <div class="d-grid gap-2">
                        <a href="/onboard" class="btn btn-primary btn-lg">
                            <i class="bi bi-plus-circle me-2"></i>Onboard New Institution
                        </a>
                    </div>

                    <hr class="my-4">
                    <p class="small text-muted mb-0">
                        Already onboarded? Visit
                        <code>/t/&lt;your-slug&gt;/login</code>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
