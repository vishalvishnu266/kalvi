[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Minimal static-file server for the Lit component library and its demos."

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# HTTP + async runtime.
axum  = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# Static file serving for /lit-components/*.
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Logging.
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
