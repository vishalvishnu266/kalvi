[package]
name = "tenant"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
maud = "0.26"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
validator = { version = "0.18", features = ["derive"] }
shared = { path = "../shared" }
auth = { path = "../auth" }
chrono = "0.4"
lazy_static = "1.4"
regex = "1.10"
