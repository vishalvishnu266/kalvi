[package]
name = "tenant"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
maud = { version = "0.26", features = ["axum"] }
shared = { path = "../shared" }
auth = { path = "../auth" }
