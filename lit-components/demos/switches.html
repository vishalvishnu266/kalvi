<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ui-switch · demo</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/global.css">
  <link rel="stylesheet" href="./_page.css">
  <script type="module" src="../components/index.js"></script>
  <script type="module" src="./_shell.js"></script>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="./index.html">← Lit playground</a>
    <h1>ui-switch</h1>
    <button id="demo-theme">Toggle theme</button>
  </header>
  <nav id="demo-nav"></nav>

  <main class="demo">
    <section>
      <h2>Basic</h2>
      <div class="stack">
        <ui-switch>Enable notifications</ui-switch>
        <ui-switch checked>Auto-save drafts</ui-switch>
        <ui-switch disabled>Beta features (coming soon)</ui-switch>
      </div>
    </section>

    <section>
      <h2>Settings-style row</h2>
      <ui-card padded>
        <ui-list-item title="Push notifications" subtitle="Get alerts on your phone">
          <ui-switch slot="trailing" checked name="push"></ui-switch>
        </ui-list-item>
        <ui-list-item title="Email digests" subtitle="Weekly summary every Monday">
          <ui-switch slot="trailing" name="email"></ui-switch>
        </ui-list-item>
        <ui-list-item title="Announcements" subtitle="School-wide broadcasts">
          <ui-switch slot="trailing" checked name="announcements"></ui-switch>
        </ui-list-item>
      </ui-card>
      <p id="log" class="muted" style="margin-top: var(--space-3);">—</p>
    </section>

    <section>
      <h2>Usage</h2>
<pre class="code">&lt;ui-switch name="enabled" checked&gt;Enabled&lt;/ui-switch&gt;</pre>
    </section>
  </main>

  <script type="module">
    document.addEventListener('ui-change', (e) => {
      if (e.target.tagName !== 'UI-SWITCH') return;
      document.getElementById('log').textContent =
        `${e.detail.name} = ${e.detail.checked}`;
    });
  </script>
</body>
</html>
