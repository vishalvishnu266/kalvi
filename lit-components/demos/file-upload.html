<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ui-file-upload · demo</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/global.css">
  <link rel="stylesheet" href="./_page.css">
  <script type="module" src="../components/index.js"></script>
  <script type="module" src="./_shell.js"></script>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="./index.html">← Lit playground</a>
    <h1>ui-file-upload</h1>
    <button id="demo-theme">Toggle theme</button>
  </header>
  <nav id="demo-nav"></nav>

  <main class="demo">
    <section>
      <h2>Single file (CSV import)</h2>
      <ui-file-upload
        id="f1"
        label="Bulk import students"
        accept=".csv,text/csv"
        hint="Max 5 MB · one row per student"
        max-size="5242880">
      </ui-file-upload>
      <p id="log" class="muted" style="margin-top: var(--space-3);">—</p>
    </section>

    <section>
      <h2>Multiple files (photos)</h2>
      <ui-file-upload
        label="Student photos"
        accept="image/*"
        multiple
        hint="JPEG or PNG · up to 2 MB each"
        max-size="2097152">
      </ui-file-upload>
    </section>

    <section>
      <h2>Usage</h2>
<pre class="code">&lt;ui-file-upload
  label="Bulk import"
  accept=".csv"
  hint="Max 5 MB"
  max-size="5242880"&gt;
&lt;/ui-file-upload&gt;

el.addEventListener('ui-change', (e) =&gt; {
  console.log(e.detail.files);   // File[]
});</pre>
    </section>
  </main>

  <script type="module">
    document.getElementById('f1').addEventListener('ui-change', (e) => {
      const names = e.detail.files.map(f => f.name).join(', ') || '(none)';
      document.getElementById('log').textContent = `Files: ${names}`;
    });
  </script>
</body>
</html>
