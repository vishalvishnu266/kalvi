<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ui-table · demo</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/global.css">
  <link rel="stylesheet" href="./_page.css">
  <script type="module" src="../components/index.js"></script>
  <script type="module" src="./_shell.js"></script>
  <style>
    /* Style the SLOTTED table (light DOM) — shadow DOM can't reach these */
    ui-table table th, ui-table table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      text-align: left;
    }
    ui-table table thead th {
      background: var(--color-surface-alt);
      font-weight: var(--fw-semibold);
      color: var(--color-text-muted);
      font-size: var(--fs-xs);
      text-transform: uppercase; letter-spacing: .04em;
    }
    ui-table table tbody tr:hover { background: var(--color-surface-alt); }
  </style>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="./index.html">← Lit playground</a>
    <h1>ui-table</h1>
    <button id="demo-theme">Toggle theme</button>
  </header>
  <nav id="demo-nav"></nav>

  <main class="demo">
    <section>
      <h2>Basic table</h2>
      <ui-card padded>
        <ui-table>
          <table>
            <thead>
              <tr><th>Name</th><th>Grade</th><th>Roll</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr><td>Aarav Kumar</td><td>5</td><td>12</td><td><ui-badge tone="success">Present</ui-badge></td></tr>
              <tr><td>Meera Sharma</td><td>5</td><td>13</td><td><ui-badge tone="warning">Late</ui-badge></td></tr>
              <tr><td>Rohan Patel</td><td>5</td><td>14</td><td><ui-badge tone="danger">Absent</ui-badge></td></tr>
              <tr><td>Diya Verma</td><td>5</td><td>15</td><td><ui-badge tone="success">Present</ui-badge></td></tr>
            </tbody>
          </table>
        </ui-table>
      </ui-card>
    </section>

    <section>
      <h2>Usage</h2>
<pre class="code">&lt;ui-table&gt;
  &lt;table&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;…&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;&lt;tr&gt;…&lt;/tr&gt;&lt;/tbody&gt;
  &lt;/table&gt;
&lt;/ui-table&gt;</pre>
    </section>
  </main>
</body>
</html>
