<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ui-daterange · demo</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/global.css">
  <link rel="stylesheet" href="./_page.css">
  <script type="module" src="../components/index.js"></script>
  <script type="module" src="./_shell.js"></script>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="./index.html">← Lit playground</a>
    <h1>ui-daterange</h1>
    <button id="demo-theme">Toggle theme</button>
  </header>
  <nav id="demo-nav"></nav>

  <main class="demo">
    <section>
      <h2>Basic</h2>
      <ui-daterange id="dr" label="Date range" from="2026-07-01" to="2026-07-28"></ui-daterange>
      <p id="log" class="muted">from=2026-07-01, to=2026-07-28</p>
    </section>

    <section>
      <h2>Usage</h2>
<pre class="code">&lt;ui-daterange label="Date range" from="2026-07-01" to="2026-07-28"&gt;&lt;/ui-daterange&gt;</pre>
    </section>
  </main>

  <script type="module">
    document.getElementById('dr').addEventListener('ui-change', (e) => {
      document.getElementById('log').textContent =
        `from=${e.detail.from}, to=${e.detail.to}`;
    });
  </script>
</body>
</html>
