<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ui-combobox · demo</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/global.css">
  <link rel="stylesheet" href="./_page.css">
  <script type="module" src="../components/index.js"></script>
  <script type="module" src="./_shell.js"></script>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="./index.html">← Lit playground</a>
    <h1>ui-combobox</h1>
    <button id="demo-theme">Toggle theme</button>
  </header>
  <nav id="demo-nav"></nav>

  <main class="demo">
    <section>
      <h2>Predefined options</h2>
      <ui-combobox label="Subject" name="subject" placeholder="Search subjects…" id="c1">
        <option value="math">Mathematics</option>
        <option value="sci">Science</option>
        <option value="eng">English</option>
        <option value="hist">History</option>
        <option value="geo">Geography</option>
        <option value="cs">Computer Science</option>
      </ui-combobox>
    </section>

    <section>
      <h2>Allow new values ("Add if not exists")</h2>
      <ui-combobox label="Tag" name="tag" placeholder="Type or choose…" allow-new id="c2">
        <option value="urgent">Urgent</option>
        <option value="follow-up">Follow-up</option>
        <option value="paid">Paid</option>
        <option value="waived">Waived</option>
      </ui-combobox>
      <p id="log" class="muted" style="margin-top: var(--space-3);">—</p>
    </section>

    <section>
      <h2>Usage</h2>
<pre class="code">&lt;ui-combobox label="Subject" name="subject" allow-new&gt;
  &lt;option value="math"&gt;Mathematics&lt;/option&gt;
  &lt;option value="sci"&gt;Science&lt;/option&gt;
&lt;/ui-combobox&gt;</pre>
    </section>
  </main>

  <script type="module">
    ['c1','c2'].forEach(id => {
      document.getElementById(id).addEventListener('ui-change', (e) => {
        document.getElementById('log').textContent =
          `${id} → value="${e.detail.value}"${e.detail.isNew ? ' (new!)' : ''}`;
      });
    });
  </script>
</body>
</html>
