<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ui-slider · demo</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/global.css">
  <link rel="stylesheet" href="./_page.css">
  <script type="module" src="../components/index.js"></script>
  <script type="module" src="./_shell.js"></script>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="./index.html">← Lit playground</a>
    <h1>ui-slider</h1>
    <button id="demo-theme">Toggle theme</button>
  </header>
  <nav id="demo-nav"></nav>

  <main class="demo">
    <section>
      <h2>Default (0–100, step 1)</h2>
      <ui-slider value="42" show-value></ui-slider>
    </section>

    <section>
      <h2>Custom bounds + step</h2>
      <ui-slider min="-20" max="20" step="2" value="0" show-value></ui-slider>
    </section>

    <section>
      <h2>Disabled</h2>
      <ui-slider value="30" show-value disabled></ui-slider>
    </section>

    <section>
      <h2>Live event log</h2>
      <ui-slider id="s" min="0" max="10" step="1" value="5" show-value></ui-slider>
      <pre class="code" id="log">(drag the slider…)</pre>
      <script type="module">
        const s = document.getElementById('s');
        const log = document.getElementById('log');
        s.addEventListener('ui-change', (e) => {
          log.textContent = `ui-change → ${JSON.stringify(e.detail)}`;
        });
      </script>
    </section>
  </main>
</body>
</html>
