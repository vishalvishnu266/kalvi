<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ui-segmented · demo</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/global.css">
  <link rel="stylesheet" href="./_page.css">
  <script type="module" src="../components/index.js"></script>
  <script type="module" src="./_shell.js"></script>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="./index.html">← Lit playground</a>
    <h1>ui-segmented</h1>
    <button id="demo-theme">Toggle theme</button>
  </header>
  <nav id="demo-nav"></nav>

  <main class="demo">
    <section>
      <h2>Basic</h2>
      <ui-segmented value="week" id="seg">
        <button value="day">Day</button>
        <button value="week">Week</button>
        <button value="month">Month</button>
      </ui-segmented>
      <p id="log" class="muted">Value: week</p>
    </section>

    <section>
      <h2>Usage</h2>
<pre class="code">&lt;ui-segmented value="week"&gt;
  &lt;button value="day"&gt;Day&lt;/button&gt;
  &lt;button value="week"&gt;Week&lt;/button&gt;
  &lt;button value="month"&gt;Month&lt;/button&gt;
&lt;/ui-segmented&gt;</pre>
    </section>
  </main>

  <script type="module">
    document.getElementById('seg').addEventListener('ui-change', (e) => {
      document.getElementById('log').textContent = `Value: ${e.detail.value}`;
    });
  </script>
</body>
</html>
