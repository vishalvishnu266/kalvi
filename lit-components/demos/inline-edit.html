<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ui-inline-edit · demo</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <link rel="stylesheet" href="../assets/global.css">
  <link rel="stylesheet" href="./_page.css">
  <script type="module" src="../components/index.js"></script>
  <script type="module" src="./_shell.js"></script>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="./index.html">← Lit playground</a>
    <h1>ui-inline-edit</h1>
    <button id="demo-theme">Toggle theme</button>
  </header>
  <nav id="demo-nav"></nav>

  <main class="demo">
    <section>
      <h2>Types</h2>
      <ui-card padded>
        <div class="stack">
          <div>Name: <ui-inline-edit value="Aarav Kumar" name="name" required></ui-inline-edit></div>
          <div>Roll: <ui-inline-edit value="12" name="roll" type="number"></ui-inline-edit></div>
          <div>Email: <ui-inline-edit value="aarav@example.com" name="email"></ui-inline-edit></div>
          <div>Notes: <ui-inline-edit value="" name="notes" placeholder="Add notes…" type="textarea"></ui-inline-edit></div>
          <div>Readonly: <ui-inline-edit value="Grade 5" readonly></ui-inline-edit></div>
        </div>
        <p id="log" class="muted" style="margin-top: var(--space-3);">Click any value to edit. Enter to commit, Escape to cancel.</p>
      </ui-card>
    </section>

    <section>
      <h2>Usage</h2>
<pre class="code">&lt;ui-inline-edit value="Aarav Kumar" name="fullName" required&gt;&lt;/ui-inline-edit&gt;
&lt;ui-inline-edit value="Notes" type="textarea"&gt;&lt;/ui-inline-edit&gt;</pre>
    </section>
  </main>

  <script type="module">
    document.addEventListener('ui-change', (e) => {
      if (e.target.tagName !== 'UI-INLINE-EDIT') return;
      document.getElementById('log').textContent =
        `${e.detail.name}: "${e.detail.previous}" → "${e.detail.value}"`;
    });
  </script>
</body>
</html>
