<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>lit-ui — DSL demo</title>
  <link rel="stylesheet" href="/lit-components/assets/tokens.css">
  <link rel="stylesheet" href="/lit-components/assets/global.css">
  <link rel="stylesheet" href="/lit-components/assets/layout.css">
  <link rel="modulepreload" href="/lit-components/components/index.js">
  <!-- Hotwire Turbo Drive: required for Hotwire Native — turns page
       navigations into HTML body swaps that the native shell can treat
       as native screens. No custom lifecycle code needed. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-esm.min.js"></script>
  <style>
    /* Hide the app until custom elements are defined, but show a spinner. */
    body:not(.ce-ready) > *:not(#app-loading) { visibility: hidden; }
    #app-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg, #fff);
      z-index: 9999;
      transition: opacity .2s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    #app-loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--color-border, #e5e7eb);
      border-top-color: var(--color-primary, #4f46e5);
      animation: ce-spin .8s linear infinite;
    }
    @keyframes ce-spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module" src="/lit-components/components/index.js"></script>
</head>
<body>
  <div id="app-loading" aria-live="polite" aria-busy="true">
    <div class="spinner" role="status" aria-label="Loading"></div>
  </div>
<ui-card title="Welcome to lit-ui" subtitle="Macro-free Rust DSL over the Lit component kit" padded><span slot="actions"><ui-button variant="ghost" size="sm" type="button" icon="info">Docs</ui-button></span>Everything on this page was built by chaining Rust methods. The output is plain HTML — no runtime, no framework hooks. Perfect for Axum / Askama / Hotwire handlers.</ui-card><ui-card title="Add student" padded><ui-input type="text" label="Full name" name="fullName" placeholder="e.g. Aarav Kumar" required></ui-input><ui-input type="email" label="Guardian email" name="email" required></ui-input><ui-input type="textarea" label="Notes" name="notes" hint="Optional"></ui-input></ui-card><ui-card padded><div class="lu-row lu-gap-md lu-align-center lu-justify-start"><ui-button variant="primary" size="md" type="button" icon="check">Save</ui-button><ui-button variant="secondary" size="md" type="button">Cancel</ui-button><span class="lu-divider lu-divider-vertical" role="separator" aria-orientation="vertical"></span><ui-button variant="danger" size="md" type="button" icon="trash">Delete</ui-button><div class="lu-spacer"></div><ui-button variant="primary" size="md" type="button" disabled>Disabled</ui-button></div></ui-card>
  <script>
    (function () {
      var TIMEOUT_MS = 1500;
      function reveal() {
        if (document.body.classList.contains('ce-ready')) return;
        document.body.classList.add('ce-ready');
        var loader = document.getElementById('app-loading');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function () { loader.remove(); }, 220);
        }
      }
      // Prefer the loader's aggregate promise (waits for core + extras
      // + any lazy chunks the current page needs). Falls back to a plain
      // whenDefined scan if index.js hasn't set __lit_ready yet.
      function whenLoaderReady() {
        if (window.__lit_ready && typeof window.__lit_ready.then === 'function') {
          return window.__lit_ready;
        }
        var tags = new Set();
        document.querySelectorAll('*').forEach(function (el) {
          var t = el.tagName.toLowerCase();
          if (t.indexOf('-') !== -1) tags.add(t);
        });
        if (!tags.size || !window.customElements) return Promise.resolve();
        return Promise.all(
          Array.from(tags).map(function (t) { return customElements.whenDefined(t); })
        );
      }
      // Poll briefly for __lit_ready — the module script may not have
      // executed by the time this inline script runs.
      var waited = 0;
      (function tick() {
        if (window.__lit_ready || waited >= 200) {
          whenLoaderReady().then(reveal).catch(reveal);
          return;
        }
        waited += 20;
        setTimeout(tick, 20);
      })();
      // Safety net: never leave the page hidden.
      setTimeout(function () {
        // Diagnostic — if we hit the safety net it means some custom
        // element failed to upgrade in time. Log the offenders so the
        // occasional "page didn't render" bug is debuggable instead of
        // silent. Only fires if we're forced to reveal via the timeout.
        if (!document.body.classList.contains('ce-ready')) {
          try {
            var missing = [];
            document.querySelectorAll('*').forEach(function (el) {
              var t = el.tagName.toLowerCase();
              if (t.indexOf('-') !== -1 && !customElements.get(t)) {
                missing.push(t);
              }
            });
            if (missing.length) {
              console.warn('[lit-ui] FOUCE safety-net fired — un-upgraded custom elements:',
                Array.from(new Set(missing)).sort());
            }
          } catch (_) {}
        }
        reveal();
      }, TIMEOUT_MS);
    })();
  </script>
</body>
</html>
