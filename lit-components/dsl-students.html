<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Students · ERP demo</title>
  <link rel="stylesheet" href="/lit-components/assets/tokens.css">
  <link rel="stylesheet" href="/lit-components/assets/global.css">
  <link rel="stylesheet" href="/lit-components/assets/layout.css">
  <link rel="modulepreload" href="/lit-components/components/index.js">
  <!-- Hotwire Turbo Drive: required for Hotwire Native — turns page
       navigations into HTML body swaps that the native shell can treat
       as native screens. No custom lifecycle code needed. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-esm.min.js"></script>
  <style>
    /* Hide the app until custom elements are defined, but show a spinner. */
    body:not(.ce-ready) > *:not(#app-loading) { visibility: hidden; }
    #app-loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg, #fff);
      z-index: 9999;
      transition: opacity .2s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    #app-loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--color-border, #e5e7eb);
      border-top-color: var(--color-primary, #4f46e5);
      animation: ce-spin .8s linear infinite;
    }
    @keyframes ce-spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module" src="/lit-components/components/index.js"></script>
</head>
<body>
  <div id="app-loading" aria-live="polite" aria-busy="true">
    <div class="spinner" role="status" aria-label="Loading"></div>
  </div>
<div class="lu-container lu-container-lg"><div class="lu-col lu-gap-lg lu-align-stretch lu-justify-start"><div class="lu-row lu-gap-md lu-align-center lu-justify-start lu-stack-m"><ui-breadcrumb separator="/"><a href="#/">Home</a><a href="#/students">Students</a><span>Grade 5</span></ui-breadcrumb><div class="lu-spacer"></div><ui-button variant="secondary" size="md" type="button" icon="upload">Import CSV</ui-button><ui-button variant="primary" size="md" type="button" icon="plus">Add student</ui-button></div><div class="lu-grid lu-grid-fit-200 lu-gap-md"><ui-stat label="Total students" value="8" trend="up" icon="users" delta="+2.1%"></ui-stat><ui-stat label="Present today" value="4" trend="up" icon="check" delta="+3.2%"></ui-stat><ui-stat label="Late arrivals" value="2" trend="up" icon="bell" delta="+0.8%"></ui-stat><ui-stat label="Absent" value="2" trend="down" icon="x" delta="-1.4%"></ui-stat></div><div class="lu-row lu-gap-lg lu-align-start lu-justify-start lu-stack-m"><div class="lu-col lu-gap-md lu-align-stretch lu-justify-start lu-flex-3 lu-min-w-320"><section class="lu-section"><header class="lu-section-header"><h2>All students</h2><span class="lu-section-subtitle">Grade 5</span><div class="lu-section-actions"><ui-button variant="ghost" size="sm" type="button" icon="filter">Filters</ui-button></div></header><ui-card padded><ui-data-table id="students-table" searchable selectable per-page="5"></ui-data-table><script>(function(){
  var t = document.getElementById("students-table");
  if (!t) return;
  t.columns = [{ key: "name", label: "Name", sortable: true },{ key: "grade", label: "Grade", sortable: true, align: "center" },{ key: "roll", label: "Roll", sortable: true, align: "right" },{ key: "status", label: "Status", sortable: true, render: (v)=>`<ui-badge tone="${v==='present'?'success':v==='late'?'warning':'danger'}" dot>${v}</ui-badge>` }];
  t.rows    = [{ "grade": "5", "name": "Aarav Kumar", "roll": "12", "status": "present" },{ "grade": "5", "name": "Meera Sharma", "roll": "13", "status": "late" },{ "grade": "5", "name": "Rohan Patel", "roll": "14", "status": "absent" },{ "grade": "6", "name": "Diya Verma", "roll": "21", "status": "present" },{ "grade": "6", "name": "Ishaan Thakur", "roll": "22", "status": "present" },{ "grade": "7", "name": "Kavya Nair", "roll": "33", "status": "late" },{ "grade": "7", "name": "Priya Mehta", "roll": "34", "status": "present" },{ "grade": "8", "name": "Aryan Iyer", "roll": "41", "status": "absent" }];
})();</script></ui-card></section></div><div class="lu-col lu-gap-md lu-align-stretch lu-justify-start lu-flex-1 lu-min-w-280"><section class="lu-section"><header class="lu-section-header"><h2>Quick add</h2><span class="lu-section-subtitle">New student</span></header><ui-card padded><ui-form method="post" action="/students"><ui-input type="text" label="Full name" name="fullName" placeholder="e.g. Aarav Kumar" required></ui-input><ui-input type="email" label="Guardian email" name="email" required></ui-input><ui-select label="Grade" name="grade" placeholder="Choose…" required><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="8">Grade 8</option></ui-select><ui-radio-group name="gender" value="F" orientation="horizontal"><ui-radio value="M">Male</ui-radio><ui-radio value="F">Female</ui-radio><ui-radio value="X">Prefer not to say</ui-radio></ui-radio-group><ui-checkbox name="consent" required>I consent to the school&#39;s data policy</ui-checkbox><ui-switch name="notify" checked>Send onboarding email</ui-switch><span slot="actions"><ui-button variant="secondary" size="md" type="button">Cancel</ui-button></span><span slot="actions"><ui-button variant="primary" size="md" type="submit" icon="check">Save</ui-button></span></ui-form></ui-card></section></div></div></div></div>
  <script>
    (function () {
      var TIMEOUT_MS = 1500;
      function reveal() {
        if (document.body.classList.contains('ce-ready')) return;
        document.body.classList.add('ce-ready');
        var loader = document.getElementById('app-loading');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function () { loader.remove(); }, 220);
        }
      }
      // Prefer the loader's aggregate promise (waits for core + extras
      // + any lazy chunks the current page needs). Falls back to a plain
      // whenDefined scan if index.js hasn't set __lit_ready yet.
      function whenLoaderReady() {
        if (window.__lit_ready && typeof window.__lit_ready.then === 'function') {
          return window.__lit_ready;
        }
        var tags = new Set();
        document.querySelectorAll('*').forEach(function (el) {
          var t = el.tagName.toLowerCase();
          if (t.indexOf('-') !== -1) tags.add(t);
        });
        if (!tags.size || !window.customElements) return Promise.resolve();
        return Promise.all(
          Array.from(tags).map(function (t) { return customElements.whenDefined(t); })
        );
      }
      // Poll briefly for __lit_ready — the module script may not have
      // executed by the time this inline script runs.
      var waited = 0;
      (function tick() {
        if (window.__lit_ready || waited >= 200) {
          whenLoaderReady().then(reveal).catch(reveal);
          return;
        }
        waited += 20;
        setTimeout(tick, 20);
      })();
      // Safety net: never leave the page hidden.
      setTimeout(function () {
        // Diagnostic — if we hit the safety net it means some custom
        // element failed to upgrade in time. Log the offenders so the
        // occasional "page didn't render" bug is debuggable instead of
        // silent. Only fires if we're forced to reveal via the timeout.
        if (!document.body.classList.contains('ce-ready')) {
          try {
            var missing = [];
            document.querySelectorAll('*').forEach(function (el) {
              var t = el.tagName.toLowerCase();
              if (t.indexOf('-') !== -1 && !customElements.get(t)) {
                missing.push(t);
              }
            });
            if (missing.length) {
              console.warn('[lit-ui] FOUCE safety-net fired — un-upgraded custom elements:',
                Array.from(new Set(missing)).sort());
            }
          } catch (_) {}
        }
        reveal();
      }, TIMEOUT_MS);
    })();
  </script>
</body>
</html>
