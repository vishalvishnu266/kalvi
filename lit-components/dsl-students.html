<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Students · ERP demo</title>
  <link rel="stylesheet" href="/lit-components/assets/tokens.css">
  <link rel="stylesheet" href="/lit-components/assets/global.css">
  <script type="module" src="/lit-components/components/index.js"></script>
</head>
<body>
<div style="max-width:1200px;margin-left:auto;margin-right:auto;padding-left:var(--space-5);padding-right:var(--space-5);box-sizing:border-box;"><div style="display:flex;flex-direction:column;gap:var(--space-5);align-items:stretch;justify-content:flex-start;min-width:0;"><div style="display:flex;flex-direction:row;flex-wrap:wrap;gap:var(--space-4);align-items:center;justify-content:flex-start;min-width:0;"><ui-breadcrumb separator="/"><a href="#/">Home</a><a href="#/students">Students</a><span>Grade 5</span></ui-breadcrumb><div style="flex:1 1 auto;"></div><ui-button variant="secondary" size="md" icon="upload">Import CSV</ui-button><ui-button variant="primary" size="md" icon="plus">Add student</ui-button></div><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:var(--space-4);min-width:0;"><ui-stat label="Total students" value="1,248" trend="up" icon="users" delta="+2.1%"></ui-stat><ui-stat label="Present today" value="1,102" trend="up" icon="check" delta="+3.2%"></ui-stat><ui-stat label="Late arrivals" value="47" trend="up" icon="bell" delta="+0.8%"></ui-stat><ui-stat label="Absent" value="99" trend="down" icon="x" delta="-1.4%"></ui-stat></div><div style="display:flex;flex-direction:row;flex-wrap:wrap;gap:var(--space-5);align-items:flex-start;justify-content:flex-start;min-width:0;"><div style="display:flex;flex-direction:column;gap:var(--space-4);align-items:stretch;justify-content:flex-start;flex:3 1 0;min-width:300px;min-width:0;"><ui-card title="All students" subtitle="Grade 5" padded><span slot="actions"><ui-button variant="ghost" size="sm" icon="filter">Filters</ui-button></span><ui-data-table id="students-table" searchable selectable per-page="5"></ui-data-table><script>(function(){
  var t = document.getElementById("students-table");
  if (!t) return;
  t.columns = [{ key: "name", label: "Name", sortable: true },{ key: "grade", label: "Grade", sortable: true, align: "center" },{ key: "roll", label: "Roll", sortable: true, align: "right" },{ key: "status", label: "Status", sortable: true, render: (v)=>`<ui-badge tone="${v==='present'?'success':v==='late'?'warning':'danger'}" dot>${v}</ui-badge>` }];
  t.rows    = [{ "grade": "5", "name": "Aarav Kumar", "roll": "12", "status": "present" },{ "grade": "5", "name": "Meera Sharma", "roll": "13", "status": "late" },{ "grade": "5", "name": "Rohan Patel", "roll": "14", "status": "absent" },{ "grade": "6", "name": "Diya Verma", "roll": "21", "status": "present" },{ "grade": "6", "name": "Ishaan Thakur", "roll": "22", "status": "present" },{ "grade": "7", "name": "Kavya Nair", "roll": "33", "status": "late" },{ "grade": "7", "name": "Priya Mehta", "roll": "34", "status": "present" },{ "grade": "8", "name": "Aryan Iyer", "roll": "41", "status": "absent" }];
})();</script></ui-card></div><div style="display:flex;flex-direction:column;gap:var(--space-4);align-items:stretch;justify-content:flex-start;flex:1 1 0;min-width:280px;min-width:0;"><ui-card title="Quick add" subtitle="New student" padded><ui-form method="post" action="/students"><ui-input type="text" label="Full name" name="fullName" placeholder="e.g. Aarav Kumar" required></ui-input><ui-input type="email" label="Guardian email" name="email" required></ui-input><ui-select label="Grade" name="grade" placeholder="Choose…" required><option value="4">Grade 4</option><option value="5">Grade 5</option><option value="6">Grade 6</option><option value="7">Grade 7</option><option value="8">Grade 8</option></ui-select><ui-radio-group name="gender" value="F" orientation="horizontal"><ui-radio value="M">Male</ui-radio><ui-radio value="F">Female</ui-radio><ui-radio value="X">Prefer not to say</ui-radio></ui-radio-group><ui-checkbox name="consent" required>I consent to the school&#39;s data policy</ui-checkbox><ui-switch name="notify" checked>Send onboarding email</ui-switch><span slot="actions"><ui-button variant="secondary" size="md">Reset</ui-button></span><span slot="actions"><ui-button variant="primary" size="md" icon="check">Save</ui-button></span></ui-form></ui-card></div></div></div></div>
</body>
</html>
