[package]
name = "school_erp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "school_erp"
path = "src/main.rs"

[lib]
name = "school_erp"
path = "src/lib.rs"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
axum = "0.8.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["normalize-path"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"

# Web (server-rendered) UI
askama = "0.12"
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
urlencoding = "2"

# Typed Rust DSL over the Lit web components (see rust-dsl/).
lit-ui = { path = "rust-dsl" }

[dev-dependencies]
# Integration tests talk to a real running server over HTTP via reqwest's
# blocking client. Start the server first (e.g. `bash scripts/dev_reset.sh`)
# then run `cargo test`. Point at a different instance with:
#   BASE_URL=http://127.0.0.1:4000 cargo test
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
