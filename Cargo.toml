[package]
name = "kalvi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["request-id", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
sqlx = { version = "0.7.0", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
askama = "0.12"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# --- Auth (Phase 0.2) ---
# Argon2id for password hashing (OWASP-recommended for new applications).
argon2 = { version = "0.5", features = ["std"] }
# RNG for session tokens and password salts.
rand = "0.8"
# password-hash traits (PasswordHash, PasswordHasher, PasswordVerifier).
password-hash = { version = "0.5", features = ["std"] }
# Base64 for encoding opaque session tokens.
base64 = "0.22"
