[workspace]
resolver = "2"
members = [
    "rust-dsl",
    "rust-dsl-macros",
    "server",
]

# Shared, workspace-wide package metadata. Individual crates can inherit
# fields from here using `field.workspace = true` if they choose to.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# Release profile tuned for small, fast binaries. Kept here so both crates
# benefit without duplicating settings.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
