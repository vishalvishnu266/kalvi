[package]
name = "kalvi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["request-id", "trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5.0", features = ["axum", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }
uuid = { version = "1.0", features = ["v4"] }
sqlx = { version = "0.7.0", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
