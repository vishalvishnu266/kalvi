<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sunrise K-12 · Attendance</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/global.css">
  <script type="module" src="components/index.js"></script>
</head>
<body>
  <app-shell page-title="Attendance" active="attendance">

    <section style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6);">
      <ui-stat label="Class"           value="Grade 5-B"  icon="building"></ui-stat>
      <ui-stat label="Present"         value="28 / 32"    delta="+2" trend="up"  icon="check"></ui-stat>
      <ui-stat label="Absent"          value="3"          delta="-1" trend="down" icon="x"></ui-stat>
      <ui-stat label="On Leave"        value="1"          icon="calendar"></ui-stat>
    </section>

    <ui-card title="Mark Attendance" subtitle="Tuesday, 28 July 2026">
      <div slot="actions">
        <ui-button size="sm" variant="secondary">Mark all present</ui-button>
        <ui-button size="sm">Save</ui-button>
      </div>

      <ui-tab-bar>
        <a href="#" data-active>Grade 5-B</a>
        <a href="#">Grade 5-A</a>
        <a href="#">Grade 6-A</a>
      </ui-tab-bar>

      <ui-list-item title="Aarav Kumar"    subtitle="Roll 12">
        <ui-avatar slot="leading" name="Aarav Kumar"></ui-avatar>
        <div slot="trailing" class="row">
          <ui-button size="sm" variant="ghost">P</ui-button>
          <ui-button size="sm" variant="ghost">A</ui-button>
          <ui-button size="sm" variant="ghost">L</ui-button>
        </div>
      </ui-list-item>
      <ui-list-item title="Meera Sharma"   subtitle="Roll 04">
        <ui-avatar slot="leading" name="Meera Sharma"></ui-avatar>
        <ui-badge slot="trailing" tone="success" dot>Present</ui-badge>
      </ui-list-item>
      <ui-list-item title="Rohan Iyer"     subtitle="Roll 27">
        <ui-avatar slot="leading" name="Rohan Iyer"></ui-avatar>
        <ui-badge slot="trailing" tone="danger" dot>Absent</ui-badge>
      </ui-list-item>
      <ui-list-item title="Zara Fernandes" subtitle="Roll 09">
        <ui-avatar slot="leading" name="Zara Fernandes"></ui-avatar>
        <ui-badge slot="trailing" tone="warning" dot>Leave</ui-badge>
      </ui-list-item>
      <ui-list-item title="Ishaan Patel"   subtitle="Roll 15">
        <ui-avatar slot="leading" name="Ishaan Patel"></ui-avatar>
        <ui-badge slot="trailing" tone="success" dot>Present</ui-badge>
      </ui-list-item>
      <ui-list-item title="Priya Nair"     subtitle="Roll 22">
        <ui-avatar slot="leading" name="Priya Nair"></ui-avatar>
        <ui-badge slot="trailing" tone="success" dot>Present</ui-badge>
      </ui-list-item>
    </ui-card>

  </app-shell>
</body>
</html>
