{% extends "base.html" %}

{% block title %}Students - SchoolDesk ERP{% endblock %}

{% block content %}
<div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-2">
  <div>
    <h1>Students</h1>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/web/{{ tenant_id }}/dashboard">Home</a></li>
        <li class="breadcrumb-item active text-muted-custom">Students</li>
      </ol>
    </nav>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-soft"><i class="fas fa-file-export me-1"></i> Export</button>
    <a href="/web/{{ tenant_id }}/students/new" class="btn btn-accent">
      <i class="fas fa-plus me-1"></i> Add Student
    </a>
  </div>
</div>

<!-- Filters (Turbo Frame — submitting the form replaces the results frame) -->
<div class="card mb-4">
  <div class="card-body py-3">
    <form method="get" action="/web/{{ tenant_id }}/students"
          data-turbo-frame="students-list"
          data-turbo-action="advance">
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Class</label>
          <select name="class_name" class="form-select" onchange="this.form.requestSubmit()">
            <option value="">All Classes</option>
            {% for c in class_options %}
              <option value="{{ c }}" {% if filters.class_name_matches(c) %}selected{% endif %}>Class {{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Section</label>
          <select name="section" class="form-select" onchange="this.form.requestSubmit()">
            <option value="">All Sections</option>
            {% for sec in section_options %}
              <option value="{{ sec }}" {% if filters.section_matches(sec) %}selected{% endif %}>{{ sec }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Status</label>
          <select name="status" class="form-select" onchange="this.form.requestSubmit()">
            <option value="">All Status</option>
            {% for st in status_options %}
              <option value="{{ st }}" {% if filters.status_matches(st) %}selected{% endif %}>{{ st }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Search</label>
          <input type="text" name="q" class="form-control"
                 value="{{ filters.q }}"
                 placeholder="Name, admission no, email...">
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Turbo Frame for the results table -->
<turbo-frame id="students-list">
  {% include "students/_list.html" %}
</turbo-frame>
{% endblock %}
