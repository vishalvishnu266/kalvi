<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>New Tenant · Admin · School ERP</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/dark.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace-autoloader.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="/assets/themes.css" />
  <link rel="stylesheet" href="/assets/app-shell.css" />
  <script src="/assets/boot.js"></script>
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="admin-header-inner" style="max-width: 48rem;">
      <a href="/admin/tenants" class="icon-btn-link" aria-label="Back">
        <sl-icon name="arrow-left"></sl-icon>
      </a>
      <div>
        <div class="admin-title">New tenant</div>
        <div class="admin-subtitle">Create a tenant row and provision its database</div>
      </div>
      <div class="admin-actions">
        <sl-select data-font-picker  size="small" hoist placeholder="Font"></sl-select>
        <sl-select data-brand-picker size="small" hoist placeholder="Theme"></sl-select>
        <sl-tooltip content="Toggle light/dark">
          <sl-icon-button name="moon-stars" label="Toggle theme" data-theme-toggle></sl-icon-button>
        </sl-tooltip>
      </div>
    </div>
  </header>

  <main class="admin-main" style="max-width: 48rem;">
    {% if let Some(msg) = error %}
    <sl-alert variant="danger" open closable class="alert">
      <sl-icon slot="icon" name="exclamation-octagon"></sl-icon>
      {{ msg }}
    </sl-alert>
    {% endif %}

    <form method="post" action="/admin/tenants" class="admin-form">
      <div>
        <sl-input name="tenant_id" label="Tenant ID" required pattern="[A-Za-z0-9_-]{1,64}"
                  value="{{ form.tenant_id }}" placeholder="acme">
        </sl-input>
        <p class="hint">Short slug used in URLs (<code>/web/&lt;id&gt;/</code>). Letters, digits, <code>-</code>, <code>_</code>.</p>
      </div>

      <sl-input name="name" label="Display name" required value="{{ form.name }}" placeholder="Acme Public School">
      </sl-input>

      <div class="row-2">
        <sl-input name="plan" label="Plan (optional)" value="{{ form.plan }}"
                  placeholder="starter / pro / enterprise"></sl-input>
        <sl-input name="notes" label="Notes (optional)" value="{{ form.notes }}"
                  placeholder="Internal notes"></sl-input>
      </div>

      <div class="admin-form-actions">
        <sl-button href="/admin/tenants" variant="default">Cancel</sl-button>
        <sl-button type="submit" variant="primary">
          <sl-icon slot="prefix" name="check2"></sl-icon>
          Create tenant
        </sl-button>
      </div>
    </form>
  </main>
</body>
</html>
