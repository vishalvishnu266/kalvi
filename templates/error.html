<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <title>{{ status }} — SchoolDesk ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/public/css/theme.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:var(--body-bg);">
  <div class="text-center p-5" style="max-width:520px;">
    {% if status == 403 %}
      <i class="fas fa-lock fa-4x mb-3 text-danger"></i>
      <h1 class="display-4 fw-800">Access Denied</h1>
    {% else if status == 404 %}
      <i class="fas fa-compass fa-4x mb-3 text-accent"></i>
      <h1 class="display-4 fw-800">Not Found</h1>
    {% else %}
      <i class="fas fa-exclamation-triangle fa-4x mb-3 text-warning"></i>
      <h1 class="display-1 fw-800 text-accent">{{ status }}</h1>
    {% endif %}
    <p class="fs-5 text-muted-custom mb-4">{{ message }}</p>
    <div class="d-flex gap-2 justify-content-center">
      <a href="javascript:history.back()" class="btn btn-soft">
        <i class="fas fa-arrow-left me-1"></i> Go Back
      </a>
      <a href="/" class="btn btn-accent">
        <i class="fas fa-home me-1"></i> Home
      </a>
    </div>
    {% if !request_id.is_empty() %}
    <div class="fs-xs text-muted-custom mt-4">Request ID: {{ request_id }}</div>
    {% endif %}
  </div>
</body>
</html>
