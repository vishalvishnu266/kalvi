<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <title>{{ status }} — SchoolDesk ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/theme.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:var(--body-bg);">
  <div class="text-center p-5">
    <h1 class="display-1 fw-800 text-accent">{{ status }}</h1>
    <p class="fs-5 text-muted-custom mb-4">{{ message }}</p>
    <a href="/" class="btn btn-accent">Back to Home</a>
    {% if request_id %}
    <div class="fs-xs text-muted-custom mt-4">Request ID: {{ request_id }}</div>
    {% endif %}
  </div>
</body>
</html>
