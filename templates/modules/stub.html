{% extends "base.html" %}

{% block content %}

<div class="max-w-3xl mx-auto text-center py-8 sm:py-16">

  <!-- Big icon matching the launcher tile -->
  <div class="inline-flex items-center justify-center w-24 h-24 sm:w-28 sm:h-28 rounded-3xl
              bg-gradient-to-br {{ module.gradient }} text-white
              shadow-2xl shadow-black/10 dark:shadow-black/40
              ring-1 ring-black/5 dark:ring-white/5">
    <i data-lucide="{{ module.icon }}" class="w-12 h-12 sm:w-14 sm:h-14 drop-shadow"></i>
  </div>

  <!-- Badge -->
  <div class="mt-6">
    <span class="inline-flex items-center gap-1.5 text-xs px-3 py-1 rounded-full
                 bg-amber-50 text-amber-700 border border-amber-100
                 dark:bg-amber-500/10 dark:text-amber-300 dark:border-amber-500/20">
      <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Coming soon
    </span>
  </div>

  <!-- Title + tagline -->
  <h2 class="mt-4 text-3xl sm:text-4xl font-semibold tracking-tight">{{ module.title }}</h2>
  <p class="mt-3 text-zinc-600 dark:text-zinc-400">{{ module.tagline }}</p>

  <!-- Feature list -->
  <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
    {% for f in module.features %}
    <div class="flex items-start gap-3 p-3 rounded-xl bg-white border border-zinc-200
                dark:bg-zinc-900 dark:border-zinc-800 shadow-sm">
      <div class="mt-0.5 w-6 h-6 rounded-lg bg-brand-50 text-brand-600
                  dark:bg-brand-500/10 dark:text-brand-400
                  flex items-center justify-center flex-shrink-0">
        <i data-lucide="check" class="w-3.5 h-3.5"></i>
      </div>
      <div class="text-sm text-zinc-700 dark:text-zinc-300">{{ f }}</div>
    </div>
    {% endfor %}
  </div>

  <!-- Back to home CTA -->
  <div class="mt-10">
    <a href="/web/{{ nav.tenant_id }}/" data-turbo-frame="page"
       class="inline-flex items-center gap-2 h-10 px-4 rounded-xl text-sm font-medium
              bg-white text-zinc-900 border border-zinc-200 hover:bg-zinc-50
              dark:bg-zinc-900 dark:text-zinc-100 dark:border-zinc-800 dark:hover:bg-zinc-800">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      Back to menu
    </a>
  </div>
</div>

{% endblock %}
