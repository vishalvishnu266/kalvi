<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Student</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #111; }
    main { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem; }
    .card { background: #fff; border: 1px solid #e4e4e7; border-radius: .75rem; padding: 1rem; margin-top: 1rem; }
    a { color: #4f46e5; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <a href="/portal/{{ tenant_id }}/students">← Back to students</a>
    <section class="card">
      <h1>{{ student.name }}</h1>
      <p>Admission # {{ student.admission_no }}</p>
    </section>
  </main>
</body>
</html>
