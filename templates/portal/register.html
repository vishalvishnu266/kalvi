<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Portal Register · School ERP</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/dark.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace-autoloader.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="/assets/themes.css" />
  <link rel="stylesheet" href="/assets/app-shell.css" />
  <script src="/assets/boot.js"></script>
</head>
<body class="auth-body">

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark"><sl-icon name="person-plus-fill"></sl-icon></div>
        <h1>Create portal account</h1>
        <p>Register once, link multiple schools later</p>
      </div>

      <sl-card>
        {% match error %}
        {% when Some with (e) %}
          <sl-alert variant="danger" open class="alert">
            <sl-icon slot="icon" name="exclamation-octagon"></sl-icon>
            {{ e }}
          </sl-alert>
        {% when None %}
        {% endmatch %}

        <form method="post" action="/portal/register" class="auth-fields">
          <sl-input name="username" label="Username" required value="{{ username }}">
            <sl-icon slot="prefix" name="person"></sl-icon>
          </sl-input>
          <sl-input name="email" type="email" label="Email" required value="{{ email }}">
            <sl-icon slot="prefix" name="envelope"></sl-icon>
          </sl-input>
          <sl-input name="password" type="password" label="Password" minlength="8" required password-toggle>
            <sl-icon slot="prefix" name="lock"></sl-icon>
          </sl-input>
          <sl-button type="submit" variant="primary">Register</sl-button>
        </form>

        <p class="auth-alt">Already have an account? <a href="/portal/login">Sign in</a></p>
      </sl-card>
    </div>
  </div>
</body>
</html>
