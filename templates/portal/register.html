<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Register</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #111; }
    main { max-width: 32rem; margin: 0 auto; padding: 2rem 1rem; }
    .card { background: #fff; border: 1px solid #e4e4e7; border-radius: .75rem; padding: 1rem; }
    input { width: 100%; box-sizing: border-box; padding: .55rem .6rem; border: 1px solid #d4d4d8; border-radius: .4rem; margin-top: .25rem; }
    button { padding: .55rem .8rem; border: 0; border-radius: .4rem; background: #4f46e5; color: #fff; cursor: pointer; }
    .err { color: #b91c1c; margin-bottom: .6rem; }
    a { color: #4f46e5; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<main>
  <h1>Create Portal Account</h1>
  <section class="card">
    {% match error %}
    {% when Some with (e) %}<p class="err">{{ e }}</p>{% when None %}{% endmatch %}
    <form method="post" action="/portal/register">
      <label>Username
        <input name="username" value="{{ username }}" required />
      </label>
      <label style="display:block; margin-top:.7rem;">Email
        <input name="email" type="email" value="{{ email }}" required />
      </label>
      <label style="display:block; margin-top:.7rem;">Password
        <input name="password" type="password" minlength="8" required />
      </label>
      <div style="margin-top:.9rem;">
        <button type="submit">Register</button>
      </div>
    </form>
    <p style="margin-top:.8rem; font-size:.9rem;">Already have an account? <a href="/portal/login">Sign in</a></p>
  </section>
</main>
</body>
</html>
