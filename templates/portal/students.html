<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Students</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #111; }
    main { max-width: 64rem; margin: 0 auto; padding: 2rem 1rem; }
    .card { background: #fff; border: 1px solid #e4e4e7; border-radius: .75rem; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .6rem .8rem; border-bottom: 1px solid #e4e4e7; text-align: left; }
    th:last-child, td:last-child { text-align: right; }
    a { color: #4f46e5; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="/portal/{{ tenant_id }}/">← Portal home</a>
      <h1>My Students</h1>
      <p>{{ rows.len() }} student(s)</p>
    </header>
    <section class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Admission #</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for s in rows %}
          <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.admission_no }}</td>
            <td>
              <a href="/portal/{{ tenant_id }}/students/{{ s.id }}">View</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
