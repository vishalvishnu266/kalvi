<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #111; }
    main { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem; }
    .card { background: #fff; border: 1px solid #e4e4e7; border-radius: .75rem; padding: 1rem; }
    a { color: #4f46e5; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Parent/Student Portal</h1>
      <p>Signed in as {{ user_display }} · Tenant {{ tenant_id }}</p>
    </header>
    <section class="card">
      <h2>Quick links</h2>
      <ul>
        <li><a href="/portal/{{ tenant_id }}/students">My Students</a></li>
        <li><a href="/web/logout">Sign out</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
