<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Portal Login · School ERP</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/dark.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace-autoloader.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

  <link rel="stylesheet" href="/assets/themes.css" />
  <link rel="stylesheet" href="/assets/app-shell.css" />
  <script src="/assets/boot.js"></script>
</head>
<body class="auth-body">

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark"><sl-icon name="people-fill"></sl-icon></div>
        <h1>Portal Login</h1>
        <p>Sign in to the parent / student portal</p>
      </div>

      <sl-card>
        {% match error %}
        {% when Some with (e) %}
          <sl-alert variant="danger" open class="alert">
            <sl-icon slot="icon" name="exclamation-octagon"></sl-icon>
            {{ e }}
          </sl-alert>
        {% when None %}
        {% endmatch %}

        <form method="post" action="/portal/login" class="auth-fields">
          <sl-input name="identifier" label="Username or Email" required value="{{ identifier }}" autocomplete="username">
            <sl-icon slot="prefix" name="person"></sl-icon>
          </sl-input>
          <sl-input name="password" type="password" label="Password" required autocomplete="current-password" password-toggle>
            <sl-icon slot="prefix" name="lock"></sl-icon>
          </sl-input>
          <sl-button type="submit" variant="primary">Sign in</sl-button>
        </form>

        <p class="auth-alt">No portal account? <a href="/portal/register">Register</a></p>
      </sl-card>

      <p class="auth-footer">&copy; 2026 School ERP · Secure multi-tenant portal</p>
    </div>
  </div>
</body>
</html>
