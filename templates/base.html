<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

  <title>{% block title %}{{ nav.page_title }}{% endblock %} · School ERP</title>

  <!-- Shoelace: light + dark themes, then the autoloader.
       The autoloader dynamically imports each `<sl-*>` element on demand. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/dark.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace-autoloader.js"></script>

  <!-- Google Fonts — all font packs referenced by themes.css.
       Preconnect first, then a single merged CSS request. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

  <!-- Brand tokens must load BEFORE app-shell.css so overrides win. -->
  <link rel="stylesheet" href="/assets/themes.css" />
  <link rel="stylesheet" href="/assets/app-shell.css" />

  <!-- Pre-paint theme resolver (colour mode + brand theme, no FOUC). -->
  <script src="/assets/boot.js"></script>

  <!-- Hotwire Turbo (SPA-like nav). -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-esm.min.js"></script>
  <script defer src="/assets/app.js"></script>
</head>

<body>
  {% block body %}
  <div class="app-shell">

    {% include "partials/sidebar.html" %}

    <div class="main-col">
      {% include "partials/topbar.html" %}

      <main class="content">
        <turbo-frame id="page" data-turbo-action="advance">
          {% block content %}{% endblock %}
        </turbo-frame>
      </main>
    </div>
  </div>

  {% include "partials/bottom_nav.html" %}
  {% endblock %}
</body>
</html>
