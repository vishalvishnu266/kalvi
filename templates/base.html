<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

  <title>{% block title %}{{ nav.page_title }}{% endblock %} · School ERP</title>

  <!-- Pre-paint theme resolver (no FOUC). -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind Play CDN. Configured with the `class` dark-mode strategy. -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system','BlinkMacSystemFont','"SF Pro Text"','"SF Pro Display"',
                   '"Segoe UI"','Roboto','Helvetica','Arial','sans-serif','"Apple Color Emoji"',
                   '"Segoe UI Emoji"'],
          },
          colors: {
            brand: {
              50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',
              400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',
              800:'#3730a3',900:'#312e81'
            }
          },
          boxShadow: {
            hairline: '0 0 0 1px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.04)',
          },
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/assets/app.css" />

  <!-- Hotwire Turbo (SPA-like nav) + Stimulus (progressive enhancement). -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-esm.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="/assets/app.js"></script>
</head>

<body class="h-full bg-zinc-50 text-zinc-900 antialiased selection:bg-brand-200 selection:text-brand-900
             dark:bg-zinc-950 dark:text-zinc-100 font-sans">

  {% block body %}
  <div class="min-h-full flex">

    <!-- Sidebar (desktop only). -->
    {% include "partials/sidebar.html" %}

    <!-- Main column. -->
    <div class="flex-1 flex flex-col min-w-0
                pb-[calc(4.5rem+env(safe-area-inset-bottom))] md:pb-0">

      {% include "partials/topbar.html" %}

      <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6 max-w-[1400px] w-full mx-auto">
        <turbo-frame id="page" data-turbo-action="advance">
          {% block content %}{% endblock %}
        </turbo-frame>
      </main>
    </div>
  </div>

  <!-- Bottom nav (mobile only). -->
  {% include "partials/bottom_nav.html" %}
  {% endblock %}

</body>
</html>
