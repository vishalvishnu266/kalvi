<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Component Storybook · School ERP</title>

  <link rel="stylesheet" href="/assets/themes.css" />
  <link rel="stylesheet" href="/assets/app-shell.css" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  
  <style>
    :root {
      --color-primary: #0a84ff;
    }
    body {
      font-family: 'Inter', sans-serif;
      padding: 2rem;
      background: var(--bg-gradient, #fafbff);
      color: var(--color-text, #0f172a);
      min-height: 100vh;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--color-border, #eee);
    }
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .component-section {
      margin-bottom: 4rem;
    }
    .component-header {
      margin-bottom: 1rem;
    }
    .component-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .component-desc {
      color: var(--color-text-muted, #666);
      font-size: 0.9rem;
    }
    .preview {
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #eee);
      border-radius: 12px;
      padding: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    select, input[type="color"] {
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--color-border, #ccc);
      background: var(--color-surface, #fff);
      color: var(--color-text, #000);
    }
  </style>

  <script type="module" src="/assets/boot.js"></script>
  <script type="module">
    // Load all components
    import '/assets/app.js';
    
    window.setTheme = (theme) => {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('erp.theme', theme);
    };

    window.setPrimary = (color) => {
      document.documentElement.style.setProperty('--color-primary', color);
      localStorage.setItem('erp.primary', color);
    };

    // Init
    const savedTheme = localStorage.getItem('erp.theme') || 'light';
    document.documentElement.dataset.theme = savedTheme;
    document.getElementById('theme-select').value = savedTheme;

    const savedPrimary = localStorage.getItem('erp.primary') || '#0a84ff';
    document.documentElement.style.setProperty('--color-primary', savedPrimary);
    document.getElementById('primary-color').value = savedPrimary;
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Component Storybook</h1>
      <div class="controls">
        <label>Theme: 
          <select id="theme-select" onchange="setTheme(this.value)">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label>Primary: 
          <input type="color" id="primary-color" onchange="setPrimary(this.value)">
        </label>
      </div>
    </header>

    {% for comp in components %}
    <section class="component-section">
      <div class="component-header">
        <div class="component-name">{{ comp.name }}</div>
        <div class="component-desc">{{ comp.description }}</div>
      </div>
      <div class="preview">
        {{ comp.html|safe }}
      </div>
    </section>
    {% endfor %}
  </div>
</body>
</html>
