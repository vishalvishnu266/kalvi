<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="logo"><sl-icon name="mortarboard-fill"></sl-icon></div>
    <span>School ERP</span>
  </div>

  <nav class="sidebar-nav">
    <ul>
      {% for item in nav_items %}
      <li>
        <a href="/web/{{ nav.tenant_id }}/{{ item.href }}"
           data-turbo-frame="page"
           class="{% if nav.active == item.key %}active{% endif %}">
          <sl-icon name="{{ item.icon }}"></sl-icon>
          <span>{{ item.label }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </nav>

  <div class="sidebar-foot">
    <div class="sidebar-user">
      <sl-avatar initials="{{ nav.user_display|truncate(1) }}" label="{{ nav.user_display }}"></sl-avatar>
      <div class="sidebar-user-info">
        <div class="name">{{ nav.user_display }}</div>
        <div class="meta">Tenant · {{ nav.tenant_id }}</div>
      </div>
      <form action="/web/logout" method="post" data-turbo="false">
        <sl-tooltip content="Sign out">
          <button type="submit" class="icon-btn-link" aria-label="Sign out"
                  style="background:none; border:0; cursor:pointer;">
            <sl-icon name="box-arrow-right"></sl-icon>
          </button>
        </sl-tooltip>
      </form>
    </div>
  </div>
</aside>
