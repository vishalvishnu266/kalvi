<aside class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 md:z-30
              bg-white/80 backdrop-blur border-r border-zinc-200
              dark:bg-zinc-900/80 dark:border-zinc-800">
  <div class="h-16 flex items-center gap-2 px-5 border-b border-zinc-200 dark:border-zinc-800">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white shadow-sm">
      <i data-lucide="school" class="w-5 h-5"></i>
    </div>
    <div class="font-semibold tracking-tight">School ERP</div>
  </div>

  <nav class="flex-1 overflow-y-auto py-3">
    <ul class="px-2 space-y-0.5">
      {% for item in nav_items %}
      <li>
        <a href="{{ item.href }}"
           data-turbo-frame="page"
           class="group flex items-center gap-3 px-3 py-2 rounded-lg text-sm
                  {% if nav.active == item.key %}
                    bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-300
                  {% else %}
                    text-zinc-700 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-800
                  {% endif %}">
          <i data-lucide="{{ item.icon }}"
             class="w-4 h-4
                    {% if nav.active == item.key %}text-brand-600 dark:text-brand-400
                    {% else %}text-zinc-500 group-hover:text-zinc-700 dark:text-zinc-400{% endif %}"></i>
          <span>{{ item.label }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </nav>

  <div class="px-3 py-3 border-t border-zinc-200 dark:border-zinc-800">
    <div class="flex items-center gap-3 px-2 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-800/50">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 text-white
                  flex items-center justify-center text-xs font-medium">
        {{ nav.user_display|truncate(1) }}
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium truncate">{{ nav.user_display }}</div>
        <div class="text-[11px] text-zinc-500 truncate">Tenant · {{ nav.tenant_id }}</div>
      </div>
      <form action="/logout" method="post" data-turbo="false">
        <button class="p-1.5 rounded-md text-zinc-500 hover:text-rose-600 hover:bg-rose-50
                       dark:hover:bg-rose-500/10" title="Sign out">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </form>
    </div>
  </div>
</aside>

<div class="hidden md:block md:w-64 md:flex-shrink-0"></div>
