<nav class="bottom-nav">
  {% for item in nav_items %}
    {% if item.mobile %}
    <a href="/web/{{ nav.tenant_id }}/{{ item.href }}"
       data-turbo-frame="page"
       class="{% if nav.active == item.key %}active{% endif %}">
      <sl-icon name="{{ item.icon }}"></sl-icon>
      <span>{{ item.label }}</span>
    </a>
    {% endif %}
  {% endfor %}
</nav>
