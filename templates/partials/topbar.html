<header class="sticky top-0 z-20 h-16 flex items-center gap-3 px-4 sm:px-6
               bg-white/70 backdrop-blur border-b border-zinc-200
               dark:bg-zinc-950/70 dark:border-zinc-800
               pt-[env(safe-area-inset-top)]">
  <!-- Mobile brand -->
  <div class="md:hidden flex items-center gap-2">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white">
      <i data-lucide="school" class="w-5 h-5"></i>
    </div>
  </div>

  <h1 class="text-lg font-semibold tracking-tight truncate">{{ nav.page_title }}</h1>

  <span class="hidden sm:inline-flex ml-2 text-[11px] px-2 py-0.5 rounded-full
               bg-zinc-100 text-zinc-600 border border-zinc-200
               dark:bg-zinc-800 dark:text-zinc-300 dark:border-zinc-700">
    {{ nav.tenant_id }}
  </span>

  <div class="ml-auto flex items-center gap-1">
    <button data-controller="search" class="hidden sm:flex items-center gap-2 h-9 px-3 rounded-lg
             text-sm text-zinc-500 bg-zinc-100/70 hover:bg-zinc-200/70
             dark:bg-zinc-800 dark:hover:bg-zinc-700">
      <i data-lucide="search" class="w-4 h-4"></i>
      <span>Search…</span>
      <kbd class="ml-2 text-[10px] px-1.5 py-0.5 rounded bg-white border border-zinc-200
                  text-zinc-500 dark:bg-zinc-900 dark:border-zinc-700">⌘K</kbd>
    </button>

    <button data-theme-toggle
            class="w-9 h-9 flex items-center justify-center rounded-lg
                   text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100
                   dark:text-zinc-400 dark:hover:text-zinc-100 dark:hover:bg-zinc-800"
            title="Toggle theme">
      <i data-lucide="moon" class="w-4 h-4 hidden dark:inline"></i>
      <i data-lucide="sun"  class="w-4 h-4 inline dark:hidden"></i>
    </button>

    <button class="relative w-9 h-9 flex items-center justify-center rounded-lg
                   text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100
                   dark:text-zinc-400 dark:hover:text-zinc-100 dark:hover:bg-zinc-800">
      <i data-lucide="bell" class="w-4 h-4"></i>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500 ring-2 ring-white dark:ring-zinc-950"></span>
    </button>

    <div class="w-9 h-9 md:hidden ml-1 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600
                text-white flex items-center justify-center text-xs font-medium">
      {{ nav.user_display|truncate(1) }}
    </div>
  </div>
</header>
