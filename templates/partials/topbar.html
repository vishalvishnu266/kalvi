<header class="topbar">
  <div class="topbar-mobile-brand"><sl-icon name="mortarboard-fill"></sl-icon></div>

  <h1>{{ nav.page_title }}</h1>
  <sl-badge variant="neutral" pill>{{ nav.tenant_id }}</sl-badge>

  <div class="spacer"></div>

  <button class="search" type="button" onclick="var el=document.querySelector('[data-search-input]'); if(el){el.focus();el.select&&el.select();}">
    <sl-icon name="search"></sl-icon>
    <span>Search…</span>
    <kbd>⌘K</kbd>
  </button>

  <!-- Font pack + brand theme pickers (auto-populated by boot.js). -->
  <sl-select data-font-picker  size="small" hoist placeholder="Font"></sl-select>
  <sl-select data-brand-picker size="small" hoist placeholder="Theme"></sl-select>

  <sl-tooltip content="Toggle light/dark">
    <sl-icon-button name="moon-stars" label="Toggle theme" data-theme-toggle></sl-icon-button>
  </sl-tooltip>

  <sl-tooltip content="Notifications">
    <sl-icon-button name="bell" label="Notifications"></sl-icon-button>
  </sl-tooltip>

  <sl-avatar initials="{{ nav.user_display|truncate(1) }}" label="{{ nav.user_display }}"></sl-avatar>
</header>
